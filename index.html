<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>WaveRiders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<style>
/* Layout : carnet de stage. Bandeau collant (logo + navigation par pôle), une colonne ; chaque pôle a trois onglets : Missions (avec grille sous chaque mission), Ressources, Mon bilan. */
:root{
  --bg:#f1f8f9; --surface:#ffffff; --ink:#0d2a35; --muted:#4e6770; --line:#cfe1e5;
  --sapin:#0b7285; --sapin-soft:#d6eff3; --soleil:#ffb35c; --on-soleil:#15251f; --on-accent:#ffffff;
  --ciel:#ffe3c2; --mont1:#9fc3b5; --mont2:#4aa6b5; --mur:#f1f2f7; --vitre:#c3d6ee; --sol:#f3dfb8;
  --ts:#1e8e4a; --s:#9bd15a; --i:#f6a23a; --ti:#d8452f; --on-ts:#ffffff; --on-s:#15251f; --on-i:#15251f; --on-ti:#ffffff;
  --display:"Sora","Trebuchet MS",system-ui,sans-serif; --body:"Nunito Sans","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08222a; --surface:#103039; --ink:#e9f6f8; --muted:#a3c2c9; --line:#25505b;
  --sapin:#6fd0df; --sapin-soft:#12404a; --on-accent:#08222a;
  --ciel:#3a2a3a; --mont1:#2d4a41; --mont2:#1f5c68; --mur:#3a4841; --vitre:#3f6b78; --sol:#5a4a30; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#08222a; --surface:#103039; --ink:#e9f6f8; --muted:#a3c2c9; --line:#25505b;
  --sapin:#6fd0df; --sapin-soft:#12404a; --on-accent:#08222a;
  --ciel:#3a2a3a; --mont1:#2d4a41; --mont2:#1f5c68; --mur:#3a4841; --vitre:#3f6b78; --sol:#5a4a30; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p,ul,ol{margin:0} ul,ol{padding-left:1.2rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sapin);outline-offset:2px}
a{color:var(--sapin);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sapin)}
.bar .top{display:flex;align-items:center;gap:.7rem;padding:.4rem 16px}
.bar img{width:48px;height:48px;border-radius:50%;flex:none}
.bar .who{flex:1;min-width:0}
.bar .who b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.1}
.bar .who span{font-size:.72rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.nav{display:flex;gap:.4rem;overflow-x:auto;padding:0 16px .5rem}
.nav button{white-space:nowrap;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .85rem;font-weight:700;font-size:.9rem}
.nav button[aria-current=true]{background:var(--sapin);border-color:var(--sapin);color:var(--on-accent)}
main{max-width:50rem;margin:0 auto;padding-inline:16px;padding-block:1.5rem 4rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.big{gap:1.8rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sapin);font-weight:700}
h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:800} h1 em{font-style:normal;background:var(--soleil);color:var(--on-soleil);padding:0 .2em;border-radius:6px}
h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1rem}
.small{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.memo{background:var(--sapin-soft);border-radius:16px 16px 16px 4px;padding:.9rem 1rem}
.say{display:flex;gap:.7rem;align-items:flex-start}.say>div{min-width:0}.av{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--sapin);color:var(--on-accent);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}.nm{display:block;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--sapin)}
.doc{border:2px dashed var(--line);border-radius:12px;padding:.8rem 1rem;background:var(--bg)}
.shop{width:100%;aspect-ratio:3/2;object-fit:cover;object-position:50% 62%;border-radius:16px;display:block;border:2px solid var(--line)}
svg.shop{aspect-ratio:auto;height:auto}
.prod{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}.prod div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.8rem;display:flex;flex-direction:column;gap:.2rem}.prod b{font-family:var(--display)}.prod .px{color:var(--sapin);font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}.chips span{font-size:.78rem;font-weight:700;border-radius:999px;padding:.1rem .7rem;background:var(--soleil);color:var(--on-soleil)}.chips span+span{background:var(--sapin-soft);color:var(--sapin)}
.vise{border-left:5px solid var(--soleil);padding:.2rem 0 .2rem .8rem;font-size:.9rem;display:flex;flex-direction:column;gap:.25rem}.vise .pb{font-family:var(--display);font-size:1.05rem}.vise ul{padding-left:1.1rem}
.aide{border:2px solid var(--line);border-radius:12px;padding:.6rem .9rem;display:flex;flex-direction:column;gap:.4rem;font-size:.9rem}.aide .btn{padding:.35rem .8rem;font-size:.88rem}
.sim{display:flex;flex-direction:column;gap:.45rem}.sim .sq{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.45rem .7rem}.sim .sq.on{border-color:var(--sapin);font-weight:700}.sim .rp{margin:0 0 .2rem 1.2rem;border-radius:4px 14px 14px 14px;padding:.45rem .7rem;border:2px solid var(--ts);background:var(--surface)}.sim .rp.no{border-color:var(--ti)}.sim .rp b{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;display:block}
details.fiche{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem}details.fiche summary{font-family:var(--display);font-weight:800;font-size:1.1rem;cursor:pointer}details.fiche>div{margin-top:.7rem}
details.carte{border:2px dashed var(--ti);border-radius:12px;padding:.6rem .9rem;background:var(--bg)}details.carte summary{font-weight:700;cursor:pointer}details.carte>div{margin-top:.5rem}
.chk{display:flex;flex-direction:column;gap:.3rem}.chk label{display:flex;gap:.6rem;align-items:flex-start;font-weight:400}.chk input{margin-top:.35rem;flex:none;width:1.1rem;height:1.1rem}.chk .tot{font-weight:700}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.kpi{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.kpi div{background:var(--sapin-soft);border-radius:12px;padding:.6rem .8rem}
.kpi b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.pole{text-align:left;align-items:flex-start}
.pill{font-size:.8rem;background:var(--soleil);color:var(--on-soleil);border-radius:999px;padding:.1rem .7rem;font-weight:700;align-self:flex-start}
.track{height:10px;border-radius:999px;background:var(--sapin-soft);overflow:hidden;width:100%}
.track i{display:block;height:100%;background:var(--sapin);border-radius:999px}
.btn{background:var(--sapin);color:var(--on-accent);border:0;border-radius:12px;padding:.6rem 1.1rem;font-weight:700;align-self:flex-start}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:.6rem}
.tabs button{border:0;background:transparent;padding:.4rem .8rem;border-radius:10px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--sapin-soft);color:var(--sapin)}
label.f{display:flex;flex-direction:column;gap:.25rem;font-weight:700;font-size:.92rem}
input[type=text],textarea,select{width:100%;padding:.6rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
textarea{min-height:4.5rem;resize:vertical}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.in td{padding:.2rem} table.in input{min-width:8rem;padding:.4rem .5rem}
.q{display:flex;flex-direction:column;gap:.4rem;padding:.7rem 0;border-bottom:1px dashed var(--line)}
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.35rem .8rem;text-align:left}
.opt.good{background:var(--ts);border-color:var(--ts);color:var(--on-ts);font-weight:700}
.opt.bad{background:var(--ti);border-color:var(--ti);color:var(--on-ti)}
.why{font-size:.88rem;color:var(--muted)}
.eval{border:2px solid var(--sapin);border-radius:14px;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;background:var(--bg)}
.eval .ref{font-size:.88rem}
.ind{display:flex;flex-direction:column;gap:.35rem;padding:.5rem 0;border-top:1px solid var(--line)}
.lv{display:grid;gap:.3rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr))}
.lv label{border:2px solid var(--c);border-radius:10px;padding:.3rem .5rem;font-size:.82rem;cursor:pointer;background:var(--surface);display:flex;align-items:center;gap:.4rem;font-weight:700}
.lv label::before{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.lv input{position:absolute;opacity:0}
.lv label:has(input:checked){background:var(--c);color:var(--oc)}
.lv label:has(input:checked)::before{background:var(--oc)}
.lv label:has(input:focus-visible){outline:3px solid var(--ink)}
.l1{--c:var(--ts);--oc:var(--on-ts)} .l2{--c:var(--s);--oc:var(--on-s)} .l3{--c:var(--i);--oc:var(--on-i)} .l4{--c:var(--ti);--oc:var(--on-ti)}
.chip{display:inline-block;border-radius:999px;padding:.05rem .6rem;font-size:.78rem;font-weight:700;background:var(--c);color:var(--oc)}
.chip.l0{--c:var(--line);--oc:var(--ink)}
.poster{border-radius:16px;padding:1.6rem 1.2rem;text-align:center;display:flex;flex-direction:column;gap:.7rem;align-items:center;background:var(--sapin);color:var(--on-accent);max-width:20rem;align-self:center;width:100%;aspect-ratio:3/4;justify-content:center}
.poster.c2{background:var(--soleil);color:var(--on-soleil)} .poster.c3{background:var(--ti);color:var(--on-ti)}
.poster .a{font-family:var(--display);font-size:1.8rem;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.poster .o{background:var(--surface);color:var(--ink);border-radius:12px;padding:.5rem .8rem;font-weight:700;overflow-wrap:anywhere}
.poster .c{font-size:.8rem;overflow-wrap:anywhere}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:1rem;font-family:var(--body);font-size:.9rem;margin:0}
#print{display:none}
.pr h1{font-size:1.4rem;margin-bottom:.2rem}.pr h2{font-size:1.15rem;margin:1.2rem 0 .3rem;border-bottom:2px solid var(--sapin);padding-bottom:.2rem}.pr h3{font-size:1rem;margin:.9rem 0 .2rem}
.pr .ans{border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.8rem;margin:.1rem 0 .5rem}
.pr .lab{font-weight:700;font-size:.88rem}.pr .meta{font-size:.85rem;color:var(--muted)}.pr table{margin-bottom:.5rem}.pr .blk{break-inside:avoid}
@media print{
  :root{--bg:#ffffff;--surface:#ffffff;--ink:#15251f;--muted:#56675f;--line:#b9c7bd;--sapin:#1f6f5c;--sapin-soft:#dcefe8}
  body{background:#ffffff}
  body>header,main{display:none!important}
  #print{display:block;padding:0;font-size:11pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
footer{font-size:.8rem;color:var(--muted);text-align:center;margin-top:2.5rem}
</style>

</head>

{id:"p1", court:"Pôle commercial", nom:"Pôle commercial", titre:"Développer les ventes", duree:"3 missions", bloc:"Blocs 1 et 3 · Conseiller et vendre · Fidéliser la clientèle et développer la relation client",
 memo:"L'été arrive et c'est maintenant que tout se joue pour un surf shop. J'ai besoin de vous au service communication : un spot audio pour notre nouvelle planche, une promotion pour les réseaux sociaux et un pack complet pour équiper nos clients.",

  {t:"Mission 1 · Créer un spot publicitaire audio", lieu:"Service communication", mode:"Fiche argumentaire + spot enregistré", tache:"Argumentation d'une solution (produit et/ou service et prix) et traitement des objections", crit:"Mise en œuvre d'une argumentation convaincante et efficace",
   brief:"Nous lançons la WaveStorm Pro X. Je veux un spot audio de 30 à 45 secondes, à diffuser sur nos réseaux sociaux et à la radio du magasin. Préparez votre fiche à partir de la fiche produit, puis enregistrez votre spot sur "+VOC+", avec un vrai ton publicitaire. Votre objectif : donner envie d'acheter cette planche.",

   ind:["Identification des caractéristiques du produit","Argumentation et avantages pour le client","Techniques de persuasion","Clarté et organisation du message","Qualité du spot audio"]},
  {t:"Mission 2 · Créer une promotion pour booster les ventes", lieu:"Service communication", mode:"Publication sur les réseaux sociaux", tache:"Exploitation des sites marchands et des réseaux sociaux à des fins commerciales", crit:"Cohérence du choix des outils de fidélisation de la clientèle et/ou de développement de la relation client avec le contexte",
   brief:"Pour attirer du monde cet été, je veux une offre spéciale sur un de nos produits, annoncée par un post sur nos réseaux sociaux. Imaginez l'offre, puis créez le post sur ZEOB. Il doit donner envie d'en profiter tout de suite.",
   fields:[["prod","Le produit mis en avant","text"],["type","Mon type d'offre","select",["Réduction en %","Pack promo","Cadeau offert","Offre limitée dans le temps"]],["offre","Mon offre, claire, avec sa durée","text",0,0,"-20 % sur … jusqu'au …"],["titre","Mon titre accrocheur","text"],["vis","Le visuel que je choisis (image, couleurs, univers)","text"],["cta","Mon appel à l'action","text",0,0,"Profitez-en dès maintenant !"],["l","Lien ou nom du fichier de mon post","text"]],
   ind:["Identification et valorisation du produit","Présentation de l'offre / promotion","Créativité et visuel","Appel à l'action","Clarté et organisation du message","Respect du format réseaux sociaux"]},
  {t:"Mission 3 · Créer mon Pack Surf idéal", lieu:"En boutique", mode:"Offre commerciale + affiche + présentation orale", tache:"Conseil d'une solution adaptée : produit et/ou service + service(s) associé(s)", crit:"Proposition d'une offre de produits et/ou de services adaptée et cohérente",
   brief:"Un client veut s'équiper entièrement pour l'été. Construisez-lui une offre complète : choisissez une planche sur "+SURF+" en lisant bien les descriptions, ajoutez au moins trois articles complémentaires (combinaison, leash, housse, wax, serviette…), calculez le prix et proposez une offre spéciale. Créez ensuite l'affiche A4 de votre pack, puis présentez-le à voix haute sur "+VOC+", comme en magasin.",

 res:[
  ["La méthode CAB","<ul><li><b>C · Caractéristique</b> : un fait sur le produit. « Elle pèse 3,2 kg. »</li><li><b>A · Avantage</b> : ce que cela apporte à tout le monde. « Elle est facile à porter et à manœuvrer. »</li><li><b>B · Bénéfice</b> : ce que cela apporte à ce client. « Donc vous enchaînez les vagues sans vous fatiguer. »</li></ul>"],
  ["Construire un spot publicitaire","<ol><li><b>Une accroche</b> : une phrase qui attire l'attention.</li><li><b>Le produit</b> : son nom et son prix.</li><li><b>Les caractéristiques</b> : matériau, taille, poids, stabilité, maniabilité.</li><li><b>Les avantages pour le client</b> : confort, performance, facilité d'utilisation, type de vagues.</li><li><b>Une conclusion persuasive</b> : un slogan et une incitation à l'achat.</li></ol><p>30 à 45 secondes, un ton dynamique, le sourire dans la voix.</p>"],

  ["Calculer une remise","<p><b>Montant de la remise</b> = prix total × taux ÷ 100. <b>Prix final</b> = prix total − remise.</p><p>Exemple : un pack à 800 € avec 10 % de remise. 800 × 10 ÷ 100 = 80 €. Prix final : 800 − 80 = 720 €.</p>"],
  ["S'enregistrer avec Vocaroo","<ol><li>Branchez votre casque et ouvrez vocaroo.com.</li><li>Cliquez sur le bouton rouge, parlez, puis arrêtez.</li><li>Réécoutez-vous et recommencez si besoin.</li><li>Cliquez sur « Enregistrer et partager », copiez le lien et collez-le dans la mission.</li></ol>"]]},

 ["Réaliser un argumentaire : la méthode C.A.B. / P","<div class='tw'><table><thead><tr><th>Étape</th><th>Définition</th><th>Exemple</th></tr></thead><tbody><tr><td><b>Caractéristique</b></td><td>Une information objective sur le produit ou le service.</td><td>Ce smartphone possède un écran OLED de 6,5 pouces.</td></tr><tr><td><b>Avantage</b></td><td>Ce que cette caractéristique apporte.</td><td>L'image est très nette, même en plein soleil.</td></tr><tr><td><b>Bénéfice client</b></td><td>Ce que cela change concrètement pour le client.</td><td>Vous pourrez regarder vos vidéos en haute qualité n'importe où.</td></tr><tr><td><b>Preuve</b></td><td>Un élément qui renforce la confiance.</td><td>Ce modèle a été élu « Meilleur écran » par un magazine spécialisé.</td></tr></tbody></table></div><p><b>Distinguer les types de caractéristiques :</b></p><ul><li><b>Techniques</b> : taille, matière, poids, autonomie…</li><li><b>Commerciales</b> : prix, garantie, service après-vente, conditions de paiement…</li><li><b>Psychologiques</b> : valeur perçue, image de marque, sentiment de sécurité ou de plaisir…</li></ul>"],
 ["Créer un post sur un réseau social","<ol><li><b>Capter l'attention</b> : une phrase courte, des émojis, un visuel qui donne envie.</li><li><b>Créer de l'émotion</b> : un vocabulaire qui fait ressentir (« glisse », « liberté », « sensations »).</li><li><b>Donner envie</b> : le bénéfice du produit (« légère », « stable », « idéale pour débuter »).</li><li><b>Appeler à l'action</b> : « À découvrir dès maintenant dans notre boutique d'Hossegor ! »</li><li><b>Mettre des hashtags</b> : ils servent à classer les contenus sur les réseaux sociaux. Une fois publié, un hashtag devient un lien vers les autres publications sur le même sujet.</li></ol><p><b>Pourquoi utiliser les hashtags ?</b></p><ul><li>Atteindre de nouvelles cibles</li><li>Générer de l'engagement</li><li>Avoir plus de visibilité</li><li>Classifier ses contenus</li><li>Identifier les retombées</li><li>Se développer à l'international</li></ul>"],
 ["Créer une affiche commerciale : la méthode AIDA","<p>Une affiche commerciale est un outil de communication utilisé par les entreprises pour attirer l'attention des clients et promouvoir une offre. Pour être efficace, elle suit la méthode <b>AIDA</b>.</p><ul><li><b>A · Attirer l'Attention</b> : une photo attractive du produit, un titre visible, des couleurs ou une mise en page dynamique.</li><li><b>I · Susciter l'Intérêt</b> : les articles inclus dans le pack, les caractéristiques principales, les avantages de l'offre. Des informations courtes et faciles à lire.</li><li><b>D · Donner le Désir</b> : un slogan accrocheur, une mise en valeur du produit, un prix promotionnel.</li><li><b>A · Inciter à l'Action</b> : le prix promotionnel, une date limite, une mention promotionnelle (offre spéciale, pack, promotion…).</li></ul><p>Le client doit comprendre l'offre en quelques secondes.</p>"],
 ["Répondre à une réclamation client : les étapes","<p><b>Objectif :</b> résoudre un mécontentement tout en maintenant une relation client positive.</p><ol><li><b>Écouter ou lire attentivement</b> la réclamation : rester calme, ne pas interrompre, reformuler pour montrer que l'on a compris.</li><li><b>Identifier le problème</b> : poser des questions précises si nécessaire.</li><li><b>S'excuser</b> si l'erreur vient de l'entreprise, en restant professionnel : « Nous sommes désolés pour ce désagrément. »</li><li><b>Proposer une solution adaptée</b> : réparation, échange, remboursement, geste commercial…</li><li><b>Vérifier l'accord du client</b> : s'assurer que la solution lui convient.</li><li><b>Confirmer par écrit</b> si besoin : e-mail ou document récapitulatif.</li><li><b>Faire un suivi</b> : relancer le client pour vérifier sa satisfaction.</li></ol>"],
 ["La foire aux questions (FAQ) : définition et rédaction","<p><b>C'est quoi une FAQ ?</b> Une liste de questions fréquentes avec leurs réponses. Elle sert à rassurer les clients, à faire gagner du temps au service client et à améliorer l'expérience des utilisateurs.</p><p><b>Comment la rédiger ?</b></p><ol><li>Lister les questions fréquentes posées par les clients.</li><li>Formuler les questions comme un client les poserait.</li><li>Répondre de manière claire et concise.</li><li>Organiser les questions par thème (livraison, paiement, retours…).</li></ol>"],
 ["Compléter un bon de commande : mode d'emploi","<p><b>Définition :</b> un bon de commande est un document commercial qui formalise une commande entre un acheteur et un vendeur. Il engage l'acheteur à acheter les produits ou services mentionnés, et le vendeur à les fournir.</p><ol><li><b>Informations du client</b> : nom, adresse, téléphone, e-mail.</li><li><b>Références des produits</b> : code article, désignation, quantité, prix unitaire HT, total HT.</li><li><b>TVA</b> : préciser le taux applicable (par exemple 20 %).</li><li><b>Total TTC</b> : total HT + TVA.</li><li><b>Conditions de livraison</b> : lieu, date souhaitée, mode de livraison.</li><li><b>Modalités de paiement</b> : chèque, virement, carte bancaire, paiement comptant ou à échéance.</li><li><b>Signature</b> : client et vendeur (et cachet de l'entreprise si besoin).</li></ol><p><b>Les calculs :</b> total HT d'une ligne = quantité × prix unitaire HT. TVA = total HT × 20 ÷ 100. <b>Franco de port</b> : la livraison est gratuite pour le client.</p>"],
 ["Les services associés","<p>Les services associés sont des prestations complémentaires à l'achat : livraison (tarifs, délais, conditions de transport), personnalisation du produit, conseils d'utilisation ou d'entretien.</p><div class='tw'><table><thead><tr><th>Services associés gratuits</th><th>Services associés payants</th></tr></thead><tbody><tr><td>Conseil personnalisé (en boutique ou à distance)<br>Emballage cadeau<br>Livraison offerte à partir d'un certain montant<br>Programme de fidélité gratuit<br>Mise en service ou démonstration du produit<br>Retrait en magasin (click and collect)</td><td>Livraison express ou à domicile<br>Installation à domicile, SAV premium<br>Extension de garantie<br>Personnalisation de produit<br>Formations, ateliers payants</td></tr><tr><td><b>Objectifs :</b> attirer, fidéliser, se différencier de la concurrence, améliorer la satisfaction client.</td><td><b>Objectifs :</b> générer du chiffre d'affaires complémentaire, répondre à des besoins spécifiques.</td></tr></tbody></table></div>"],
 ["Prendre contact à distance : la méthode CROC","<ul><li><b>C</b> · Saluer, se présenter, préciser le nom de l'entreprise, vérifier l'identité de son interlocuteur.</li><li><b>R</b> · Exposer le motif de l'appel.</li><li><b>O</b> · Développer ses idées pour arriver au résultat souhaité.</li><li><b>C</b> · Reformuler, remercier, saluer de façon personnalisée.</li></ul>"],
 ["Construire un spot publicitaire","<ol><li><b>Une accroche</b> : une phrase qui attire l'attention.</li><li><b>Le produit</b> : son nom et son prix.</li><li><b>Les caractéristiques</b> : matériau, taille, poids, stabilité, maniabilité.</li><li><b>Les avantages pour le client</b> : confort, performance, facilité d'utilisation, type de vagues.</li><li><b>Une conclusion persuasive</b> : un slogan et une incitation à l'achat.</li></ol><p>30 à 45 secondes, un ton dynamique, le sourire dans la voix.</p>"],

function fieldIds(p){ const out = []; p.missions.forEach((m,mi) => m.fields.forEach(f => out.push([p.id+"-"+mi+"-"+f[0], f]))); return out; }
function filled(id, f){ if (f[2] === "sim" || f[2] === "checks") return f[3].some((_,k) => val(id+"-"+k)); if (f[2] === "select") return true; if (f[2] !== "table") return val(id).trim() !== ""; for (let r = 0; r < f[4]; r++) if (val(id+"-"+r+"-0").trim()) return true; return false; }
function progress(p){ const ids = fieldIds(p); let done = ids.filter(x => filled(x[0], x[1])).length, tot = ids.length;
  p.missions.forEach((m,mi) => m.ind.forEach((_,i) => { tot++; if (S.g[p.id+"-"+mi+"-"+i]) done++; }));
  if (p.train) p.train.items.forEach((_,i) => { tot++; if (S.t[p.id+"-"+i] != null) done++; });
  return Math.round(done / tot * 100); }

  else if (b.dataset.simreset) { const id = b.dataset.simreset, f = fieldById(id); f[3].forEach((_,k) => delete S.v[id+"-"+k]); save(); $(id+"-sim").outerHTML = fieldHTML(id, f); }
  else if (b.dataset.bo) { const [p,i,j] = b.dataset.bo.split("|"), P = POLES.find(x => x.id === p); S.b[p+"-"+i] = +j; save(); $("bo-"+p+"-"+i).outerHTML = bonusItem(P, +i); $("bo-score-"+p).textContent = bonusScore(P); }
  else if (b.dataset.boreset) { BONUS[b.dataset.boreset].forEach((_,i) => delete S.b[b.dataset.boreset+"-"+i]); save(); render(); }
  else if (b.dataset.pdf) printOut(b.dataset.pdf);
  else if (b.id === "copy") { const t = dossierText(); const ok = () => $("copied").textContent = "Dossier copié.";
    const ko = () => { const r = document.createRange(); r.selectNodeContents($("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copied").textContent = "Le texte est sélectionné : faites Copier."; };
    try { navigator.clipboard.writeText(t).then(ok, ko); } catch(err) { ko(); } }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.type === "radio") { S.g[el.name.slice(2)] = +el.value; save(); return; }
  if (el.type === "checkbox") { S.v[el.id] = el.checked ? "1" : ""; save(); const ff = findField(el.id); if (ff && $(ff[0]+"-tot")) $(ff[0]+"-tot").textContent = "Total des accessoires : " + checkTotal(ff[0], ff[1]) + " €"; return; }
  if (!el.id) return;
  S.v[el.id] = el.value; save();
  const n = $(el.id+"-n"); if (n) { n.textContent = el.value.length + " / " + n.dataset.max + " caractères"; n.style.color = el.value.length > +n.dataset.max ? "var(--ti)" : ""; }
  if ($("poster") && el.id.startsWith("p1-2-")) $("poster").outerHTML = posterHTML();
});
render();
</script>

</body>
</html>
